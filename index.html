<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IEEE NDETI SB | The spark behind innovation</title>
  <meta name="description" content="Official website of the IEEE NDETI Student Branch in New Damietta, Egypt: workshops, hackathons and a community of engineering students.">
  <meta name="theme-color" content="#003A5A">
  <!-- Performance: DNS prefetch for external resources -->
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
  <!-- Preconnect to fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Preload critical hero logo -->
  <link rel="preload" href="assets/img/logo.jpeg" as="image">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #00629B;
      --deep: #003A5A;
      --paper: #F3F6F9;
      --ink: #10243A;
      --mute: #556A7F;
      --spark: #FFB81C;
      --line: #D3DDE6;
      --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
      --body: 'Figtree', 'Segoe UI', system-ui, sans-serif
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 72px
    }

    body {
      font-family: var(--body);
      color: var(--ink);
      background: var(--paper);
      line-height: 1.6;
      font-size: 1.0625rem
    }

    img {
      display: block;
      max-width: 100%;
      object-fit: cover;
      background: var(--line)
    }

    img.broken {
      visibility: hidden
    }

    a {
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--spark);
      outline-offset: 3px
    }

    .wrap {
      width: min(1120px, 92%);
      margin-inline: auto
    }

    h1,
    h2,
    h3 {
      font-family: var(--display);
      line-height: 1.1;
      letter-spacing: -.02em
    }

    h2 {
      font-size: clamp(2rem, 4.5vw, 3rem);
      font-weight: 800;
      margin-bottom: 1.5rem
    }

    section {
      padding: 96px 0
    }

    .btn {
      display: inline-block;
      padding: .85rem 1.5rem;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      transition: transform .2s, background .2s
    }

    .btn:hover {
      transform: translateY(-2px)
    }

    .btn.main {
      background: var(--spark);
      color: var(--deep)
    }

    .btn.ghost {
      border: 2px solid #ffffff66;
      color: #fff
    }

    .btn.ghost:hover {
      background: #ffffff1a
    }

    /* nav */
    nav {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      background: #003a5aeb;
      backdrop-filter: blur(10px);
      color: #fff
    }

    nav .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px
    }

    .logo {
      font-family: var(--display);
      font-weight: 800;
      text-decoration: none;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: .55rem
    }

    .logo img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--spark);
      background: #fff;
      flex-shrink: 0;
      padding: 2px
    }

    .logo span {
      color: var(--spark)
    }

    nav ul {
      display: flex;
      gap: 1.6rem;
      list-style: none;
      font-size: .95rem
    }

    nav ul a {
      text-decoration: none;
      opacity: .85
    }

    nav ul a:hover {
      opacity: 1;
      text-decoration: underline;
      text-decoration-color: var(--spark);
      text-underline-offset: 6px
    }

    #menu {
      display: none;
      background: none;
      border: 0;
      color: #fff;
      font-size: 1.6rem;
      cursor: pointer
    }

    /* hero */
    .hero {
      background: linear-gradient(160deg, var(--blue), var(--deep) 75%);
      color: #fff;
      padding: 140px 0 0;
      position: relative;
      overflow: hidden
    }

    .hero .wrap {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 3rem;
      align-items: center
    }

    .hero h1 {
      font-size: clamp(2.6rem, 6.5vw, 5rem);
      font-weight: 800
    }

    .hero p {
      max-width: 34rem;
      margin: 1.4rem 0 2rem;
      font-size: 1.15rem;
      color: #dbe9f3
    }

    .hero .cta {
      display: flex;
      gap: .8rem;
      flex-wrap: wrap
    }

    .collage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .collage img {
      width: 100%;
      height: 100%;
      min-height: 150px;
      border-radius: 14px;
      border: 3px solid #ffffff33
    }

    .collage img:first-child {
      grid-row: span 2;
      transform: rotate(-2deg)
    }

    .collage img:nth-child(2) {
      transform: rotate(2deg)
    }

    .collage img:nth-child(3) {
      transform: rotate(-1deg)
    }

    #wave {
      display: block;
      width: 100%;
      height: 130px;
      margin-top: 2rem
    }

    /* pillars */
    .pillars {
      background: var(--paper);
      padding: 56px 0
    }

    .pillars .wrap {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2rem
    }

    .pillars div {
      border-top: 3px solid var(--blue);
      padding-top: 1rem
    }

    .pillars h3 {
      font-size: 1.2rem;
      margin-bottom: .4rem
    }

    .pillars p {
      color: var(--mute);
      font-size: .98rem
    }

    /* about */
    .about .wrap {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 3.5rem;
      align-items: start
    }

    .about .pic img {
      width: 100%;
      aspect-ratio: 4/5;
      border-radius: 20px
    }

    .about .lead {
      color: var(--mute);
      margin-bottom: 2rem;
      max-width: 36rem
    }

    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.4rem 2rem;
      margin-bottom: 2.5rem
    }

    .facts h3 {
      font-size: 1.1rem;
      color: var(--blue)
    }

    .facts p {
      color: var(--mute);
      font-size: .97rem
    }

    .bars {
      display: grid;
      gap: .9rem
    }

    .bar {
      display: grid;
      grid-template-columns: 11rem 1fr 3rem;
      gap: 1rem;
      align-items: center;
      font-size: .95rem
    }

    .bar b {
      text-align: right;
      font-family: var(--display)
    }

    .bar .t {
      height: 8px;
      background: var(--line);
      border-radius: 9px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--blue), var(--spark));
      border-radius: 9px;
      transition: width 1.2s cubic-bezier(.2, .7, .2, 1)
    }

    .bar.in i {
      width: var(--v)
    }

    /* committees */
    .committees {
      background: var(--paper)
    }

    .rows {
      border-bottom: 1px solid var(--line)
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 2rem;
      padding: 1.4rem .8rem;
      border-top: 1px solid var(--line);
      transition: background .2s, padding-left .2s
    }

    .row:hover {
      background: var(--white);
      padding-left: 1.4rem
    }

    .row h3 {
      font-size: 1.5rem
    }

    .row p {
      color: var(--mute)
    }

    /* events */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      grid-auto-rows: 210px;
      grid-auto-flow: dense;
      gap: 12px
    }

    .gallery button {
      border: 0;
      padding: 0;
      cursor: zoom-in;
      border-radius: 14px;
      overflow: hidden;
      background: var(--line)
    }

    .gallery button:nth-child(1),
    .gallery button:nth-child(6) {
      grid-column: span 2;
      grid-row: span 2
    }

    .gallery img {
      width: 100%;
      height: 100%;
      transition: transform .5s
    }

    .gallery button:hover img {
      transform: scale(1.06)
    }

    #lb {
      position: fixed;
      inset: 0;
      background: #000d;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 2rem
    }

    #lb.open {
      display: grid
    }

    #lb img {
      max-height: 88vh;
      max-width: 92vw;
      border-radius: 10px;
      object-fit: contain
    }

    #lb button {
      position: absolute;
      background: #fff2;
      border: 0;
      color: #fff;
      font-size: 2rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer
    }

    #lb .x {
      top: 18px;
      right: 18px
    }

    #lb .p {
      left: 18px
    }

    #lb .n {
      right: 18px
    }

    /* numbers */
    .numbers {
      background: var(--deep);
      color: #fff;
      padding: 64px 0
    }

    .numbers .wrap {
      display: flex;
      gap: 4rem;
      flex-wrap: wrap;
      align-items: baseline
    }

    .numbers strong {
      font-family: var(--display);
      font-size: clamp(3rem, 8vw, 5.5rem);
      color: var(--spark);
      font-weight: 800;
      line-height: 1
    }

    .numbers span {
      display: block;
      font-size: 1.1rem;
      color: #cfe1ee
    }

    /* people */
    .sup {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 2rem;
      align-items: center;
      margin-bottom: 4rem
    }

    .sup img {
      width: 200px;
      height: 240px;
      border-radius: 20px
    }

    .sup h3 {
      font-size: 2rem
    }

    .sup p,
    .person p {
      color: var(--mute)
    }

    .team {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.4rem
    }

    .person img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      margin-bottom: .8rem
    }

    .person h3 {
      font-size: 1.2rem
    }

    .people h2+.sup {
      margin-top: 0
    }

    .people h3.sub {
      font-size: 1.6rem;
      margin-bottom: 1.4rem
    }

    /* faq */
    .faq {
      background: var(--paper)
    }

    .faq .wrap {
      max-width: 820px
    }

    details {
      border-top: 1px solid var(--line);
      padding: 1.1rem 0
    }

    details:last-child {
      border-bottom: 1px solid var(--line)
    }

    summary {
      cursor: pointer;
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.2rem;
      list-style: none;
      display: flex;
      justify-content: space-between;
      gap: 1rem
    }

    summary::after {
      content: "+";
      color: var(--blue);
      font-size: 1.5rem;
      line-height: 1;
      transition: transform .25s
    }

    details[open] summary::after {
      transform: rotate(45deg)
    }

    details p {
      color: var(--mute);
      margin-top: .7rem
    }

    /* contact */
    .contact .wrap {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 3rem
    }

    .contact h3 {
      font-size: 1.1rem;
      color: var(--blue);
      margin: 1.4rem 0 .2rem
    }

    .contact h3:first-of-type {
      margin-top: 0
    }

    .social {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      margin-top: .6rem
    }

    .social a {
      border: 2px solid var(--blue);
      color: var(--blue);
      padding: .4rem 1rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: .95rem
    }

    .social a:hover {
      background: var(--blue);
      color: #fff
    }

    iframe {
      width: 100%;
      height: 100%;
      min-height: 340px;
      border: 0;
      border-radius: 18px;
      background: var(--line)
    }

    footer {
      background: var(--deep);
      color: #cfe1ee;
      padding: 48px 0;
      font-size: .95rem
    }

    footer .wrap {
      display: flex;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      align-items: end
    }

    footer strong {
      display: block;
      font-family: var(--display);
      font-size: 1.6rem;
      color: #fff
    }

    @media(max-width:860px) {
      section {
        padding: 72px 0
      }

      #menu {
        display: block
      }

      nav ul {
        display: none;
        position: absolute;
        top: 64px;
        left: 0;
        right: 0;
        background: var(--deep);
        flex-direction: column;
        padding: 1rem 4%;
        gap: 1rem
      }

      nav ul.open {
        display: flex
      }

      .hero .wrap,
      .about .wrap,
      .contact .wrap {
        grid-template-columns: 1fr
      }

      .pillars .wrap {
        grid-template-columns: 1fr 1fr
      }

      .row {
        grid-template-columns: 1fr;
        gap: .4rem
      }

      .bar {
        grid-template-columns: 8.5rem 1fr 2.6rem
      }

      .sup {
        grid-template-columns: 1fr
      }

      .gallery {
        grid-auto-rows: 170px
      }
    }

    @media(max-width:520px) {

      .pillars .wrap,
      .facts {
        grid-template-columns: 1fr
      }

      .bar {
        grid-template-columns: 1fr 3rem
      }

      .bar span {
        grid-column: 1/-1
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        scroll-behavior: auto !important
      }
    }

    :root {
      --white: #fff
    }

    [data-theme=dark] {
      --white: #0A1726;
      --paper: #0E2034;
      --ink: #E7EFF7;
      --mute: #9DB2C5;
      --line: #213A52;
      --blue: #3FAAEA;
      color-scheme: dark
    }

    [data-theme=dark] .hero {
      background: linear-gradient(160deg, #004f7d, #00263d 75%)
    }

    [data-theme=dark] nav,
    [data-theme=dark] .numbers,
    [data-theme=dark] footer {
      background: #001d2f
    }

    [data-theme=dark] .social a:hover {
      color: #00263d
    }

    /* progress + nav extras */
    .prog {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 100%;
      background: var(--spark);
      transform-origin: 0 50%
    }

    .nr {
      display: flex;
      align-items: center;
      gap: 1.2rem
    }

    .tt {
      background: none;
      border: 2px solid #ffffff55;
      color: #fff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1
    }

    .tt:hover {
      background: #ffffff1f
    }

    nav ul a.btn {
      opacity: 1;
      color: var(--deep);
      padding: .4rem 1.1rem
    }

    nav ul a.btn:hover {
      text-decoration: none
    }

    /* hero upgrades */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(#ffffff10 1px, transparent 1px), linear-gradient(90deg, #ffffff10 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse at 70% 30%, #000, transparent 75%);
      mask-image: radial-gradient(ellipse at 70% 30%, #000, transparent 75%)
    }

    .hero .wrap,
    .sig {
      position: relative;
      z-index: 1
    }

    .collage {
      position: relative;
      transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform .25s ease-out
    }

    .collage::before {
      content: "";
      position: absolute;
      inset: -12% -8%;
      background: radial-gradient(circle at 60% 40%, #FFB81C45, transparent 60%);
      filter: blur(22px);
      z-index: -1
    }

    #wave {
      cursor: pointer
    }

    .hint {
      position: absolute;
      right: 4%;
      bottom: 10px;
      font-size: .85rem;
      color: #ffffffb8;
      pointer-events: none
    }

    .about .pic {
      isolation: isolate;
      position: relative
    }

    .about .pic::after {
      content: "";
      position: absolute;
      inset: 18px -14px -14px 18px;
      border: 3px solid var(--spark);
      border-radius: 22px;
      z-index: -1
    }

    .bars.in .bar i {
      width: var(--v)
    }

    /* committees master-detail */
    .cm {
      display: grid;
      grid-template-columns: .8fr 1.4fr;
      gap: 2rem
    }

    .cm-list {
      display: grid;
      gap: .4rem;
      align-content: start
    }

    .cm-list button {
      font: 700 1.3rem var(--display);
      text-align: left;
      padding: .9rem 1.2rem;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background .2s, padding-left .2s
    }

    .cm-list button:hover {
      background: var(--white)
    }

    .cm-list button.on {
      background: var(--blue);
      color: #fff;
      padding-left: 1.8rem
    }

    .cm-panel {
      position: relative;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 2.4rem;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
      animation: swap .35s
    }

    .cm-panel .mono {
      position: absolute;
      right: -.5rem;
      bottom: -2.2rem;
      font: 800 11rem/1 var(--display);
      color: var(--blue);
      opacity: .09;
      pointer-events: none
    }

    .cm-panel h3 {
      font-size: 2.2rem
    }

    .cm-panel p {
      color: var(--mute);
      max-width: 32rem;
      font-size: 1.15rem
    }

    .cm-panel .btn {
      align-self: flex-start;
      margin-top: .6rem;
      position: relative
    }

    @keyframes swap {
      from {
        opacity: 0;
        transform: translateY(10px)
      }
    }

    /* gallery + people polish */
    .gallery button {
      position: relative
    }

    .gallery button span {
      position: absolute;
      inset: auto 0 0;
      padding: 1.6rem .9rem .7rem;
      background: linear-gradient(transparent, #003a5acc);
      color: #fff;
      font-weight: 600;
      text-align: left;
      opacity: 0;
      transition: opacity .25s
    }

    .gallery button:hover span,
    .gallery button:focus-visible span {
      opacity: 1
    }

    .person .ph {
      overflow: hidden;
      border-radius: 16px;
      margin-bottom: .8rem;
      border-bottom: 4px solid var(--spark)
    }

    .person .ph img {
      margin: 0;
      border-radius: 0;
      transition: transform .5s
    }

    .person:hover .ph img {
      transform: scale(1.06)
    }

    /* faq accordion */
    .qa {
      border-top: 1px solid var(--line)
    }

    .qa:last-child {
      border-bottom: 1px solid var(--line)
    }

    .qa>button {
      all: unset;
      box-sizing: border-box;
      width: 100%;
      cursor: pointer;
      padding: 1.1rem 0;
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem
    }

    .qa>button::after {
      content: "+";
      color: var(--blue);
      font-size: 1.5rem;
      line-height: 1;
      transition: transform .25s
    }

    .qa.open>button::after {
      transform: rotate(45deg)
    }

    .qa>button:focus-visible {
      outline: 3px solid var(--spark);
      outline-offset: 3px
    }

    .ans {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .3s
    }

    .qa.open .ans {
      grid-template-rows: 1fr
    }

    .ans>div {
      overflow: hidden
    }

    .ans p {
      color: var(--mute);
      padding-bottom: 1.1rem
    }

    /* join form */
    .join {
      background: linear-gradient(160deg, var(--blue), var(--deep));
      color: #fff
    }

    .join .wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3.5rem;
      align-items: start
    }

    .join p {
      color: #dbe9f3;
      max-width: 30rem
    }

    .join form {
      --ink: #10243A;
      --mute: #556A7F;
      --line: #D3DDE6;
      display: grid;
      gap: 1rem;
      background: #fff;
      color: var(--ink);
      padding: 1.8rem;
      border-radius: 20px
    }

    .join label {
      display: grid;
      gap: .3rem;
      font-weight: 600;
      font-size: .95rem
    }

    .join input,
    .join select,
    .join textarea {
      font: inherit;
      padding: .7rem .9rem;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink)
    }

    .join input:focus,
    .join select:focus,
    .join textarea:focus {
      border-color: #00629B;
      outline: none
    }

    .join [aria-invalid=true] {
      border-color: #B42318
    }

    .join .err {
      color: #B42318;
      font-size: .88rem;

    }

      color: var(--mute);
      font-size: .92rem
    }

      display: block;
      color: var(--ink)

      color: #fff;

      flex-direction: column;
      justify-content: center

    }

      color: #fff
    }

      gap: .9rem;

    }

      gap: .3rem;
      font-weight: 600;

    }

    }

      background: var(--blue);
      border-color: var(--blue);

    }

      width: 48px;
      height: 48px;

    }

    }

    }

    }

    }

    }

    }

    }
  </style>
</head>

    <a className="btn main" href="gallery.html">View all photos \u2192</a>
   </div>
   ${albums.length > 1 && html`<${AlbumTabs} albums=${albums} selected=${sel} setSelected=${setSel}/>`}
   <div className="gallery">
    ${loading
      ? html`<div className="gallery-loading"><div className="spinner"></div><p>Loading photos...</p></div>`
      : items.map((img, i) => html`<button key=${img.url || i} onClick=${() => setO(i)} aria-label=${'Open photo ' + (i + 1)} className="gal-btn"><img src=${img.url} alt=${img.name} loading=${i < 3 ? 'eager' : 'lazy'} fetchpriority=${i === 0 ? 'high' : 'auto'} data-id=${img.id} data-w="480" onError=${fb}/><span>View photo</span></button>`)}
   </div>
  </div></section>
  ${o !== null && items[o] && html`<div id="lb" className="open" role="dialog" aria-label="Photo viewer" onClick=${() => setO(null)} onTouchStart=${e => { sx = e.touches[0].clientX }} onTouchEnd=${e => { const d = e.changedTouches[0].clientX - sx; if (Math.abs(d) > 50) setO((o + (d < 0 ? 1 : N - 1)) % N) }}>
   <button className="x" aria-label="Close">\u00D7</button><button className="p" aria-label="Previous" onClick=${go(-1)}>\u2039</button>
   <img key=${o} src=${items[o].id ? srcs(items[o].id, 2000)[0] : items[o].url} alt=${items[o].name} data-id=${items[o].id} data-w="2000" onError=${fb}/><button className="n" aria-label="Next" onClick=${go(1)}>\u203A</button></div>`}
  <//>`}

    function Counter({ to, suffix = '', label }) {
      const [r, v] = useInView(.5), [n, setN] = useState(0);
      useEffect(() => { if (!v) return; if (still) { setN(to); return } let s; const f = t => { s = s || t; const p = Math.min((t - s) / 1400, 1); setN(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(f) }; requestAnimationFrame(f) }, [v]);
      return html`<div ref=${r}><strong>${n}${suffix}</strong><span>${label}</span></div>`
    }
    const Numbers = () => html`<div className="numbers"><div className="wrap"><${Counter} to=${100} suffix="+" label="Members"/><${Counter} to=${10} suffix="+" label="Workshops conducted"/><${Counter} to=${8} label="Committees"/></div></div>`;

    const People = () => html`<section className="people" id="people"><div className="wrap"><h2>Our team</h2>
 <div className="sup"><${Img} n="tasneem" alt="Tasneem Mostafa" loading="lazy"/><div><p>Consultant</p><h3>Tasneem Mostafa</h3></div></div>
 <h3 className="sub">High board</h3>
 <div className="team">${TEAM.map(t => html`<div className="person" key=${t[0]}><div className="ph"><${Img} n=${t[0]} alt=${t[1]} loading="lazy"/></div><h3>${t[1]}</h3><p>${t[2]}</p></div>`)}</div></div></section>`;

    function Faq() {
      const [o, setO] = useState(0);
      return html`<section className="faq" id="faq"><div className="wrap"><h2>Frequently asked questions</h2>${FAQ.map((q, i) => html`<div key=${i} className=${'qa' + (o === i ? ' open' : '')}><button aria-expanded=${o === i} onClick=${() => setO(o === i ? -1 : i)}>${q[0]}</button><div className="ans"><div><p>${q[1]}</p></div></div></div>`)}</div></section>`
    }

    function Join() {
      const [f, setF] = useState({ name: '', email: '', com: 'Not sure yet', msg: '' }), [er, setEr] = useState({}), [sent, setSent] = useState(false);
      const set = k => e => setF({ ...f, [k]: e.target.value });
      const submit = e => {
        e.preventDefault(); const x = {};
        if (!f.name.trim()) x.name = 'Enter your name.';
        if (!/^\S+@\S+\.\S+$/.test(f.email)) x.email = 'Enter a valid email address.';
        setEr(x); if (Object.keys(x).length) return;
        const body = 'Name: ' + f.name + '\nEmail: ' + f.email + '\nCommittee: ' + f.com + '\n\n' + f.msg;
        location.href = 'mailto:' + MAIL + '?subject=' + encodeURIComponent('Membership request: ' + f.name) + '&body=' + encodeURIComponent(body); setSent(true)
      };
      return html`<section className="join" id="join"><div className="wrap">
  <div><h2>Join the branch</h2><p>Tell us who you are and which committee interests you. Your request opens as an email to the branch, and we reply with the next orientation session and membership details.</p><p style=${{ marginTop: '1rem' }}>Membership requires a fee that supports the branch\u2019s events and resources.</p></div>
  <form onSubmit=${submit} noValidate>
   <label>Full name<input value=${f.name} onInput=${set('name')} aria-invalid=${!!er.name} autoComplete="name"/>${er.name && html`<span className="err">${er.name}</span>`}</label>
   <label>Email<input type="email" value=${f.email} onInput=${set('email')} aria-invalid=${!!er.email} autoComplete="email"/>${er.email && html`<span className="err">${er.email}</span>`}</label>
   <label>Committee you are interested in<select value=${f.com} onChange=${set('com')}><option>Not sure yet</option>${COMMITTEES.map(c => html`<option key=${c[0]}>${c[0]}</option>`)}</select></label>
   <label>Message (optional)<textarea rows="3" value=${f.msg} onInput=${set('msg')}></textarea></label>
   <button className="btn main" type="submit">Send membership request</button>
   ${sent && html`<p className="ok" role="status">Your email app should open with the request ready to send. If nothing opens, write to ${MAIL}.</p>`}
  </form></div></section>`}

    const Contact = () => html`<section className="contact" id="contact"><div className="wrap"><div>
 <h2>Need help? Contact us</h2>
 <h3>Address</h3><p>Central Area, Fourth District, New Damietta, Damietta Governorate, Egypt.</p>
 <h3>Email</h3><p><a href=${'mailto:' + MAIL}>${MAIL}</a></p>
 <h3>Follow us</h3><div className="social">
  <a href="https://www.facebook.com/share/1FF6kMpaya/?mibextid=wwXIfr" target="_blank" rel="noopener">Facebook</a>
  <a href="https://www.instagram.com/ieee_ndeti?igsh=MXRqc2ZvaTljd2Vyag==" target="_blank" rel="noopener">Instagram</a>
  <a href="https://www.linkedin.com/in/ieee-ndeti" target="_blank" rel="noopener">LinkedIn</a></div><${ContactForm}/></div>
 <iframe title="Map of New Damietta" loading="lazy" referrerPolicy="no-referrer-when-downgrade" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3410.2227230490714!2d31.6666!3d31.4166!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzHCsDI1JzAwLjAiTiAzMcKwNDAnMDAuMCJF!5e0!3m2!1sen!2seg!4v1620000000000!5m2!1sen!2seg"></iframe></div></section>`;

    const Footer = () => html`<footer><div className="wrap"><div><strong>We are the spark behind innovation.</strong>IEEE NDETI Student Branch, New Damietta</div>
 <div>\u00A9 ${new Date().getFullYear()} IEEE NDETI Student Branch. All rights reserved.<br/>Designed & developed by Malak Hassan, Webmaster.</div></div></footer>`;

    const ACTIVITIES = [
      ['Hackathons', 'Build a working project with your team against the clock and sharpen your problem solving. This is also how we prepare for IEEE Xtreme and other global IEEE challenges.'],
      ['Workshops', 'Hands-on sessions led by members and guest experts that take you from theory to something you can build.'],
      ['Coding sessions', 'Regular programming sessions run by our Programming Committee, from your first lines of code to full technical projects.'],
      ['Seminars & field visits', 'Technical seminars and field visits that show you how engineering works outside the classroom.']];
    const Activities = () => html`<${React.Fragment}><div className="acts">${ACTIVITIES.map((a, i) => html`<article key=${a[0]} style=${{ '--c': i % 2 ? 'var(--spark)' : 'var(--blue)' }}><${Ico} n=${i + 4}/><h3>${a[0]}</h3><p>${a[1]}</p></article>`)}</div><h3 className="sub2">Photos from our events</h3><//>`;

    const SAMPLE = true; // set to false once the quotes below are real ones from members
    const QUOTES = [
      ['I joined to learn to code and ended up leading a team. The branch is where I first practised speaking in front of a group.', 'Member name', 'Committee and year'],
      ['The workshops gave me skills I use in my coursework, and the people made it easy to ask questions.', 'Member name', 'Committee and year'],
      ['Working in a committee taught me how to plan, share tasks and deliver on time.', 'Member name', 'Committee and year']];
    const Testimonials = () => html`<section className="voices" id="voices"><div className="wrap"><h2>What members say</h2>
 ${SAMPLE && html`<p className="draft">Sample text. Replace it with real quotes from members before you publish.</p>`}
 <div className="vq">${QUOTES.map((q, i) => html`<figure key=${i} className=${i ? '' : 'big'}><blockquote>${q[0]}</blockquote><figcaption><b>${q[1]}</b>${q[2]}</figcaption></figure>`)}</div></div></section>`;

    function ContactForm() {
      const [f, setF] = useState({ name: '', email: '', msg: '' }), [er, setEr] = useState({}), [sent, setSent] = useState(false);
      const set = k => e => setF({ ...f, [k]: e.target.value });
      const submit = e => {
        e.preventDefault(); const x = {};
        if (!f.name.trim()) x.name = 'Enter your name.';
        if (!/^\S+@\S+\.\S+$/.test(f.email)) x.email = 'Enter a valid email address.';
        if (!f.msg.trim()) x.msg = 'Write a short message.';
        setEr(x); if (Object.keys(x).length) return;
        location.href = 'mailto:' + MAIL + '?subject=' + encodeURIComponent('Message from ' + f.name) + '&body=' + encodeURIComponent(f.msg + '\n\nFrom: ' + f.name + ' (' + f.email + ')'); setSent(true)
      };
      return html`<form onSubmit=${submit} noValidate><h3>Send us a message</h3>
  <label>Name<input value=${f.name} onInput=${set('name')} aria-invalid=${!!er.name} autoComplete="name"/>${er.name && html`<span className="err">${er.name}</span>`}</label>
  <label>Email<input type="email" value=${f.email} onInput=${set('email')} aria-invalid=${!!er.email} autoComplete="email"/>${er.email && html`<span className="err">${er.email}</span>`}</label>
  <label>Message<textarea rows="4" value=${f.msg} onInput=${set('msg')} aria-invalid=${!!er.msg}></textarea>${er.msg && html`<span className="err">${er.msg}</span>`}</label>
  <button className="btn main" type="submit">Send message</button>
  ${sent && html`<p className="ok" role="status">Your email app should open with the message ready to send. If nothing opens, write to ${MAIL}.</p>`}</form>`
    }

    const CtaBanner = () => html`<section className="final"><div className="wrap"><div><h2>Ready to build something with us?</h2><p>Join 100+ students learning, competing and leading at IEEE NDETI Student Branch.</p></div><a className="btn dark" href="#join">Join Us Now</a></div></section>`;

    const initTheme = () => { try { const s = localStorage.getItem('theme'); if (s) return s } catch (e) { } return matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light' };
    function App() {
      const [theme, setTheme] = useState(initTheme);
      useEffect(() => { document.documentElement.dataset.theme = theme; try { localStorage.setItem('theme', theme) } catch (e) { } }, [theme]);
      return html`<${React.Fragment}><${Nav} theme=${theme} toggle=${() => setTheme(theme === 'dark' ? 'light' : 'dark')}/><${Hero}/><${Pillars}/><${About}/><${Committees}/><${Gallery}/><${Numbers}/><${People}/><${Testimonials}/><${Faq}/><${Join}/><${Contact}/><${CtaBanner}/><${Footer}/><//>`
    }
    document.addEventListener('error', e => { if (e.target.tagName === 'IMG') e.target.classList.add('broken') }, true);
    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
  </script>
</body>

</html>
